[package]
name = "visual-engine-tui"
version = "0.2.0"
edition = "2021"
description = "Ratatui TUI browser for Visual Agent Engine (max visual, minimal interactivity)"

[[bin]]
name = "vae-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
